name: CI Build & Pack

on:
  push:
    branches:
      - develop
  workflow_dispatch: {}

jobs:
  build-and-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-packages-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-packages-${{ runner.os }}-

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine package version
        id: pkgver
        run: |
          # Extract version from Directory.Build.props
          VERSION=$(grep '<Version>' src/Directory.Build.props | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/' || echo "0.0.0")
          if [ -z "$VERSION" ]; then
            echo "version not found in Directory.Build.props, defaulting to 0.0.0"
            VERSION=0.0.0
          fi
          # Append run number so CI packages are unique
          PACKAGE_VERSION="${VERSION}-ci.${GITHUB_RUN_NUMBER}"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "Determined PACKAGE_VERSION=$PACKAGE_VERSION"

      - name: Restore
        run: |
          set -euo pipefail
          dotnet restore src/EventSourcing.sln

      - name: Build
        run: dotnet build src/EventSourcing.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test src/EventSourcing.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory ./TestResults || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: CI Test Results
          path: '**/TestResults/*.trx'
          reporter: dotnet-trx
          fail-on-error: false

      - name: Pack NuGet packages
        run: |
          set -euo pipefail
          mkdir -p artifacts
          echo "Packing projects found by find..."
          find src -name "*.csproj" -print0 | while IFS= read -r -d '' proj; do
            echo "Packing $proj"
            if dotnet pack "$proj" -c Release -o artifacts /p:PackageVersion=${{ env.PACKAGE_VERSION }} --no-build; then
              echo "Packed $proj"
            else
              echo "Warning: pack failed for $proj; skipping"
            fi
          done

      - name: List artifacts
        run: ls -la artifacts || true

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg

      - name: Publish to NuGet.org
        if: ${{ github.ref == 'refs/heads/develop' }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          echo "Publishing packages to NuGet.org"
          shopt -s nullglob || true
          files=(artifacts/*.nupkg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No packages found, skipping publish"
            exit 0
          fi
          for pkg in "${files[@]}"; do
            echo "Pushing $pkg"
            dotnet nuget push "$pkg" -s https://api.nuget.org/v3/index.json -k "$NUGET_API_KEY" --skip-duplicate
          done
